name: Nightly CI

on:
  # Run every night at 2:00 AM Eastern (07:00 UTC)
  schedule:
    - cron: '0 7 * * *'
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build + Lint + Gherkin Scenarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Run ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
        continue-on-error: true

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify dist output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html missing — build did not complete"
            exit 1
          fi
          echo "Build output verified."

      - name: Gherkin scenario dry-run (structural check)
        run: |
          echo "Checking all .feature files are valid Gherkin..."
          npx @cucumber/cucumber --dry-run \
            --require-module ts-node/register \
            'tests/features/**/*.feature' 2>&1 | tee gherkin-check.txt
          # Exit 0 even if step definitions are missing — we just want parse errors to fail
          grep -i "parse error" gherkin-check.txt && exit 1 || echo "No parse errors found."

      - name: Notify on failure
        if: failure()
        run: |
          echo "Nightly build FAILED on $(date)"
          echo "Check the Actions tab: https://github.com/${{ github.repository }}/actions"
