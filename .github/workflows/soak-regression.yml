name: Soak Regression

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 9 * * *'

jobs:
  soak-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm run test

      - name: Run month soak simulation
        run: npm run test:month

      - name: Build app
        run: npm run build
