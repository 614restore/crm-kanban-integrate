name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build-check:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        # Supabase URL/key come from .env.production; the repo secret points at read-only QuoteMGR.
        # (This step used to have an empty `env:` key under it, which GitHub rejects as an invalid workflow file.)
        run: npm run build

      - name: Verify dist/index.html exists
        run: test -f dist/index.html && echo "Build OK" || (echo "Build FAILED" && exit 1)

      - name: Gherkin parse check
        run: |
          npx @cucumber/cucumber --dry-run \
            'tests/features/**/*.feature' 2>&1 | tee gherkin-check.txt
          grep -i "parse error" gherkin-check.txt && exit 1 || echo "Gherkin OK"
