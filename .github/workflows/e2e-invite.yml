name: E2E Invite Test

on:
  workflow_dispatch: {}

jobs:
  e2e-invite:
    name: Run E2E invite script
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_KEY }}
      INVITEE_EMAIL: ${{ secrets.E2E_INVITEE_EMAIL }}
      COMPANY_ID: ${{ secrets.E2E_COMPANY_ID }}
      INVITER_ID: ${{ secrets.E2E_INVITER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug env presence
        run: |
          echo "SUPABASE_URL set: ${SUPABASE_URL:+yes}"
          echo "SUPABASE_KEY set: ${SUPABASE_KEY:+yes}"
          echo "INVITEE_EMAIL set: ${INVITEE_EMAIL:+yes}"
        # job-level env provides secrets to this step

      - name: Install dependencies
        run: |
          echo "node:" $(node --version)
          echo "npm:" $(npm --version)
          if [ -f package-lock.json ]; then
            echo "Using npm ci (package-lock.json present)"
            npm ci || npm install --prefer-offline --no-audit --no-fund
          else
            echo "No package-lock.json found, falling back to npm install"
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Run E2E invite
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_KEY }}
          INVITEE_EMAIL: ${{ secrets.E2E_INVITEE_EMAIL }}
          COMPANY_ID: ${{ secrets.E2E_COMPANY_ID }}
          INVITER_ID: ${{ secrets.E2E_INVITER_ID }}
        run: npm run e2e:invite
