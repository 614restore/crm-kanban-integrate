name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run project doctor
        run: npm run doctor

      - name: Run tests
        run: npm run test

      - name: Run month soak simulation
        run: npm run test:month

      - name: Build app
        run: npm run build
