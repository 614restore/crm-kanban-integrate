<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
      // Handle redirected SPA routes from public/404.html on GitHub Pages.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <title>614 Restore - Restoration Management Simplified</title>
    <meta name="description" content="Professional CRM for restoration contractors with comprehensive project management. Streamline your restoration business with 614 Restore." />
    <link rel="icon" type="image/svg+xml" href="./placeholder.svg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    
    <!-- PWA Support for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="614 Restore" />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
    
    <!-- Enhanced mobile viewport -->

  </head>
