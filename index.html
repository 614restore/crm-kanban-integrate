<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
      // Handle redirected SPA routes from public/404.html on GitHub Pages.
      (function (l) {
        try {
          window.sessionStorage.removeItem('gh_pages_spa_redirect_attempted');
        } catch (e) {}
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <title>Advanced CRM for Contractors</title>
    <meta name="description" content="An all-in-one CRM solution for managing the entire customer lifecycle, with flexible Kanban boards, integration with QuickBooks, Twilio, and other tools, designed for teams of any size." />
    <link rel="icon" type="image/svg+xml" href="./placeholder.svg" />

    <meta property="og:title" content="Advanced CRM for Contractors" />
    <meta property="og:description" content="An all-in-one CRM solution for managing the entire customer lifecycle, with flexible Kanban boards, integration with QuickBooks, Twilio, and other tools, designed for teams of any size." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.jpg" />
  </head>

  </body>
</html>
